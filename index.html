*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#eceef1;color:#1c1f24;font-family:'Jost',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;

form{width:100%;max-width:300px;text-align:center}
.brand{font-size:26px;font-weight:500;margin-bottom:4px}

.hid{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}

</form>

const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d64(SALT),iterations:250000,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(IV)},k,d64(CT));
  const ds=new DecompressionStream('gzip');
  const buf=await new Response(new Blob([pt]).stream().pipeThrough(ds)).arrayBuffer();
  return new TextDecoder().decode(buf);
}
async function run(pw,remember){
  const html=await open_(pw);
  if(remember) sessionStorage.setItem('dengi_pw',pw);
  document.open(); document.write(html); document.close();
}
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const b=document.getElementById('go'); b.disabled=true; b.textContent='расшифровываю…';
  try{ await run(document.getElementById('pw').value,true); }
  catch(err){ document.getElementById('e').textContent='не тот пароль';
    b.disabled=false; b.textContent='войти'; }
});
(async()=>{ const s=sessionStorage.getItem('dengi_pw'); if(s){ try{ await run(s,false); }catch(e){ sessionStorage.removeItem('dengi_pw'); } } })();
